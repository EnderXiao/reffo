<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fff8"/>
      <stop offset="100%" stop-color="#fff7f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8aa0b5"/>
    </marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#102033}
      .subtitle{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#6a7b8f}
      .lane-title{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#41536b}
      .card-title{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#142033}
      .card-sub{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#6a7b8f}
      .small{font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#8391a3}
      .line{fill:none;stroke:#8aa0b5;stroke-width:3;marker-end:url(#arrow)}
      .line-soft{fill:none;stroke:#c2ceda;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#arrow)}
      .pill{fill:#fff;stroke:#e3ebf2;stroke-width:1.5;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1280" height="760" rx="32" fill="url(#bg)"/>
  <text x="56" y="62" class="title">Reffo 用户主旅程总览</text>
  <text x="56" y="92" class="subtitle">从首页进入创建，分步生成结果，保存历史并回到卡片堆</text>

  <rect x="56" y="130" width="1168" height="150" rx="26" fill="#ffffff" opacity="0.72"/>
  <rect x="56" y="318" width="1168" height="150" rx="26" fill="#ffffff" opacity="0.72"/>
  <rect x="56" y="506" width="1168" height="150" rx="26" fill="#ffffff" opacity="0.72"/>
  <text x="82" y="164" class="lane-title">输入与准备</text>
  <text x="82" y="352" class="lane-title">AI 分步生成</text>
  <text x="82" y="540" class="lane-title">保存与回流</text>

  <g transform="translate(180 174)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">首页</text>
    <text x="24" y="56" class="card-sub">加载卡片与源简历</text>
  </g>
  <g transform="translate(430 174)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">源简历</text>
    <text x="24" y="56" class="card-sub">录入 / 上传 / 保存</text>
  </g>
  <g transform="translate(680 174)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">岗位描述</text>
    <text x="24" y="56" class="card-sub">公司、岗位、JD</text>
  </g>
  <g transform="translate(930 174)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">等待页</text>
    <text x="24" y="56" class="card-sub">缩小卡片动效</text>
  </g>

  <path class="line" d="M350 213 H422"/>
  <path class="line" d="M600 213 H672"/>
  <path class="line" d="M850 213 H922"/>

  <g transform="translate(180 362)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">简历分析</text>
    <text x="24" y="56" class="card-sub">/mvp/analyze</text>
  </g>
  <g transform="translate(430 362)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">岗位匹配</text>
    <text x="24" y="56" class="card-sub">/mvp/match</text>
  </g>
  <g transform="translate(680 362)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">最佳简历</text>
    <text x="24" y="56" class="card-sub">/mvp/generate</text>
  </g>
  <g transform="translate(930 362)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">面试建议</text>
    <text x="24" y="56" class="card-sub">/mvp/interview</text>
  </g>

  <path class="line" d="M1015 252 C1015 306 270 305 265 354"/>
  <path class="line" d="M350 401 H422"/>
  <path class="line" d="M600 401 H672"/>
  <path class="line" d="M850 401 H922"/>

  <g transform="translate(180 550)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">点击完成</text>
    <text x="24" y="56" class="card-sub">要求全部 done</text>
  </g>
  <g transform="translate(430 550)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">保存历史</text>
    <text x="24" y="56" class="card-sub">resume_histories</text>
  </g>
  <g transform="translate(680 550)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">成功页</text>
    <text x="24" y="56" class="card-sub">卡片 + 彩带 10 秒</text>
  </g>
  <g transform="translate(930 550)">
    <rect class="pill" width="170" height="78" rx="18"/>
    <text x="24" y="33" class="card-title">回首页</text>
    <text x="24" y="56" class="card-sub">newCardId 入堆</text>
  </g>

  <path class="line" d="M1015 440 C1015 493 270 493 265 542"/>
  <path class="line" d="M350 589 H422"/>
  <path class="line" d="M600 589 H672"/>
  <path class="line" d="M850 589 H922"/>
  <path class="line-soft" d="M1015 628 C1168 700 150 718 245 252"/>
  <text x="1040" y="690" class="small">reLaunch 首页并清理页面栈</text>
</svg>
