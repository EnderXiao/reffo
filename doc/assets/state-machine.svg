<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf3"/><stop offset="1" stop-color="#f4fff8"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7990a5"/></marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#102033}
      .sub{font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#687a8d}
      .h{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#26364a}
      .t{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#516276}
      .s{fill:#fff;stroke:#dce7f0;stroke-width:1.6;rx:18;filter:url(#shadow)}
      .ok{fill:#ecfff5;stroke:#b7ebd1;stroke-width:1.8;rx:18}
      .warn{fill:#fff7ed;stroke:#f2c9a8;stroke-width:1.8;rx:18}
      .err{fill:#fff1f2;stroke:#fecdd3;stroke-width:1.8;rx:18}
      .line{fill:none;stroke:#7990a5;stroke-width:2.7;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#aab9c8;stroke-width:2.4;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1280" height="820" rx="32" fill="url(#bg)"/>
  <text x="56" y="62" class="title">页面状态机</text>
  <text x="56" y="92" class="sub">创建页、结果页、成功页三段状态独立，靠 storage 和路由参数衔接</text>

  <rect x="56" y="128" width="1168" height="180" rx="26" fill="#fff" opacity="0.72"/>
  <text x="82" y="162" class="h">创建页状态</text>
  <g transform="translate(160 190)"><rect class="s" width="170" height="68"/><text x="24" y="30" class="h">resumeUpload</text><text x="24" y="52" class="t">源简历录入</text></g>
  <g transform="translate(430 190)"><rect class="s" width="170" height="68"/><text x="24" y="30" class="h">resumeSummary</text><text x="24" y="52" class="t">源简历确认</text></g>
  <g transform="translate(700 190)"><rect class="s" width="170" height="68"/><text x="24" y="30" class="h">jobDescription</text><text x="24" y="52" class="t">岗位描述</text></g>
  <g transform="translate(970 190)"><rect class="warn" width="170" height="68"/><text x="24" y="30" class="h">generating</text><text x="24" y="52" class="t">等待 analyze/match</text></g>
  <path class="line" d="M330 224H422"/><path class="line" d="M600 224H692"/><path class="line" d="M870 224H962"/>
  <path class="dash" d="M1055 258C1055 292 800 292 790 260"/><text x="888" y="292" class="t">取消/失败回到 JD</text>

  <rect x="56" y="344" width="1168" height="220" rx="26" fill="#fff" opacity="0.72"/>
  <text x="82" y="378" class="h">结果页生成进度</text>
  <g transform="translate(130 420)"><rect class="ok" width="165" height="68"/><text x="24" y="30" class="h">analysis done</text><text x="24" y="52" class="t">岗位分析可看</text></g>
  <g transform="translate(350 420)"><rect class="ok" width="165" height="68"/><text x="24" y="30" class="h">matching done</text><text x="24" y="52" class="t">真实优化策略</text></g>
  <g transform="translate(570 420)"><rect class="warn" width="165" height="68"/><text x="24" y="30" class="h">optimized</text><text x="24" y="52" class="t">生成最佳简历</text></g>
  <g transform="translate(790 420)"><rect class="warn" width="165" height="68"/><text x="24" y="30" class="h">interview</text><text x="24" y="52" class="t">生成面试建议</text></g>
  <g transform="translate(1010 420)"><rect class="ok" width="165" height="68"/><text x="24" y="30" class="h">completeReady</text><text x="24" y="52" class="t">完成按钮可用</text></g>
  <path class="line" d="M295 454H342"/><path class="line" d="M515 454H562"/><path class="line" d="M735 454H782"/><path class="line" d="M955 454H1002"/>
  <g transform="translate(570 510)"><rect class="err" width="385" height="36"/><text x="24" y="24" class="t">任一步失败：标记 failed，保留 generationError</text></g>

  <rect x="56" y="600" width="1168" height="150" rx="26" fill="#fff" opacity="0.72"/>
  <text x="82" y="634" class="h">成功页自动返回</text>
  <g transform="translate(210 660)"><rect class="ok" width="190" height="58"/><text x="24" y="35" class="h">展示成功页</text></g>
  <g transform="translate(545 660)"><rect class="warn" width="190" height="58"/><text x="24" y="35" class="h">点击或 10 秒</text></g>
  <g transform="translate(880 660)"><rect class="ok" width="190" height="58"/><text x="24" y="35" class="h">reLaunch 首页</text></g>
  <path class="line" d="M400 689H537"/><path class="line" d="M735 689H872"/>
  <text x="500" y="742" class="t">clearAutoReturnTimer + hasNavigatedRef 防重复导航</text>
</svg>
