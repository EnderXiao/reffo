<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reffo 提示词人工评审中心</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      color: #161616;
      background: #f4f4f1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 980px; margin: auto; padding: 48px 24px; }
    h1 { font-size: 34px; margin-bottom: 8px; }
    .muted { color: #666; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 28px;
    }
    article {
      background: #fff;
      border: 1px solid #d8d8d2;
      border-radius: 12px;
      padding: 22px;
    }
    .badge {
      display: inline-block;
      border: 1px solid #222;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 13px;
    }
    a {
      display: inline-block;
      margin-top: 12px;
      color: #111;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Reffo 提示词人工评审中心</h1>
    <p class="muted">人工可读材料，请勿外传。原始 JSON 仅用于机器复核。</p>
    <div class="grid">
      <article>
        <span class="badge">v4.1 · 30 案例</span>
        <h2>全量基线评审</h2>
        <p>查看上一轮 10 份真实简历、30 份目标 JD 的完整案例页面。</p>
        <a href="v4.1-full/index.html">打开 v4.1 全量评审</a>
      </article>
      <article>
        <span class="badge">v4.2.0 · 5 案例</span>
        <h2>弱项首轮定向测试</h2>
        <p>查看 v4.1 表现最弱的 5 个案例及首轮范围边界修复效果。</p>
        <a href="v4.2-targeted/index.html">打开 v4.2 首轮评审</a>
      </article>
      <article>
        <span class="badge">v4.2.1 · 2 案例</span>
        <h2>失败案例修复复测</h2>
        <p>只复测盒马等两个首轮未通过案例，二者最终均可交付。</p>
        <a href="v4.2.1-remediation/index.html">打开 v4.2.1 修复评审</a>
      </article>
    </div>
  </main>
</body>
</html>
