<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1242" height="1660" viewBox="0 0 1242 1660" role="img" aria-labelledby="title desc">
  <title id="title">Reffo 小红书封面：一份简历别横投</title>
  <desc id="desc">高清发布版。左侧用岗位证据卡解释不同岗位需要重排简历证据，右侧使用实际运行的 Reffo Taro H5 Landing 页面。</desc>
  <defs>
    <linearGradient id="atmosphere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE9F9"/>
      <stop offset="0.34" stop-color="#EEF4FB"/>
      <stop offset="0.64" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="paperFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FBFF"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-25%" width="180%" height="185%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#151E2E" flood-opacity="0.16"/>
    </filter>
    <filter id="screenShadow" x="-25%" y="-20%" width="170%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#286FE7" flood-opacity="0.13"/>
    </filter>
    <clipPath id="landingClip">
      <rect x="732" y="632" width="426" height="924" rx="28"/>
    </clipPath>
  </defs>

  <g id="background-layer">
    <rect width="1242" height="1660" fill="url(#atmosphere)"/>
    <path d="M0 748C251 698 449 744 656 706C889 663 1050 583 1242 612V1660H0Z" fill="#FFFFFF" fill-opacity="0.48"/>
    <path d="M0 1048C246 1014 453 1081 684 1044C908 1008 1064 944 1242 968V1660H0Z" fill="#FFFFFF" fill-opacity="0.28"/>
    <g fill="#1C77EB" fill-opacity="0.038" transform="translate(1038 160) scale(3.05)">
      <path d="M48 36C48 42.0751 43.0751 47 37 47C30.9249 47 26 42.0751 26 36C26 29.9249 30.9249 25 37 25C43.0751 25 48 29.9249 48 36Z"/>
      <path d="M0 25V47H10C15.6 47 17.6667 40.6667 18 37.5V22C18 19.6 20 19.3333 21 19.5H29.5C34.7 19.5 37.3333 13.8333 38 11V0H26C22.8 0 20.6667 2 20 3C14.6667 8 3.6 18.4 2 20C0.4 21.6 0 24 0 25Z"/>
    </g>
  </g>

  <g id="brand-layer">
    <image id="official-reffo-logo" xlink:href="assets/reffo-logo.png" x="90" y="88" width="180" height="48" preserveAspectRatio="xMinYMid meet"/>
  </g>

  <g id="edition-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="1152" y="106" fill="#7D8591" font-size="20" text-anchor="end" font-weight="500" letter-spacing="2">RESUME STRATEGY</text>
    <text x="1152" y="140" fill="#111111" font-size="25" text-anchor="end" font-weight="700">01</text>
    <path d="M1089 134H1127" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="copy-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <g id="series-label">
      <circle cx="100" cy="232" r="8" fill="#1C77EB"/>
      <text x="124" y="241" fill="#4B4F56" font-size="26" font-weight="500" letter-spacing="1">一岗一简历 · 第 1 周</text>
    </g>
    <text x="88" y="398" fill="#111111" font-size="114" font-weight="600" letter-spacing="-4">
      <tspan x="88" dy="0">一份简历</tspan>
      <tspan x="88" dy="130" fill="#1C77EB">别横投</tspan>
    </text>
    <path d="M90 594H592" stroke="#AAC0DF" stroke-width="2" stroke-dasharray="10 14"/>
    <text x="92" y="668" fill="#4B4F56" font-size="38" font-weight="400">
      <tspan>换岗位，</tspan><tspan fill="#111111" font-weight="600">先换证据顺序</tspan>
    </text>
    <text x="94" y="724" fill="#7D8591" font-size="25">不是只改文件名，也不是先换模板。</text>
  </g>

  <g id="screen-annotation" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="548" y="786" width="190" height="56" rx="28" fill="#FFFFFF" stroke="#1C77EB" stroke-width="2"/>
    <text x="643" y="823" fill="#1C77EB" font-size="23" text-anchor="middle" font-weight="600">实际 H5 画面</text>
    <path d="M738 814H778V758" fill="none" stroke="#1C77EB" stroke-width="3" stroke-linecap="round"/>
    <circle cx="778" cy="758" r="7" fill="#1C77EB"/>
  </g>

  <g id="evidence-card-stack" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <g transform="translate(54 876) rotate(-4 286 302)" filter="url(#cardShadow)">
      <rect width="572" height="604" rx="28" fill="#111317"/>
      <text x="42" y="64" fill="#FFFFFF" fill-opacity="0.48" font-size="22" font-weight="500" letter-spacing="1">TARGET / B</text>
      <text x="42" y="156" fill="#FFFFFF" font-size="44" font-weight="600">岗位变了</text>
      <text x="42" y="214" fill="#FFFFFF" fill-opacity="0.70" font-size="28">阅读顺序也会变</text>
      <text x="502" y="504" fill="#FFFFFF" fill-opacity="0.14" font-family="Georgia, Times New Roman, serif" font-size="220" text-anchor="end">B</text>
    </g>

    <g transform="translate(88 920)" filter="url(#cardShadow)">
      <rect width="586" height="604" rx="28" fill="url(#paperFade)" stroke="#DFE1E6" stroke-width="2"/>
      <g transform="translate(38 38)">
        <text x="0" y="22" fill="#7D8591" font-size="21" font-weight="500">内容结构示意 · 非产品界面</text>
        <text x="0" y="100" fill="#111111" font-size="46" font-weight="600">先看岗位要什么</text>
        <path d="M0 144H510" stroke="#DFE1E6" stroke-width="2"/>

        <g transform="translate(0 186)">
          <circle cx="18" cy="18" r="18" fill="#1C77EB"/>
          <text x="18" y="26" fill="#FFFFFF" font-size="19" text-anchor="middle" font-weight="700">1</text>
          <text x="58" y="26" fill="#111111" font-size="30" font-weight="600">对应职责</text>
          <text x="510" y="24" fill="#7D8591" font-size="23" text-anchor="end">看 JD</text>
        </g>
        <path d="M18 228V270" stroke="#AAC0DF" stroke-width="3" stroke-dasharray="5 7"/>
        <g transform="translate(0 278)">
          <circle cx="18" cy="18" r="18" fill="#E5F2FF" stroke="#1C77EB" stroke-width="2"/>
          <text x="18" y="26" fill="#1C77EB" font-size="19" text-anchor="middle" font-weight="700">2</text>
          <text x="58" y="26" fill="#111111" font-size="30" font-weight="600">前置证据</text>
          <text x="510" y="24" fill="#7D8591" font-size="23" text-anchor="end">看经历</text>
        </g>
        <path d="M18 320V362" stroke="#AAC0DF" stroke-width="3" stroke-dasharray="5 7"/>
        <g transform="translate(0 370)">
          <circle cx="18" cy="18" r="18" fill="#E5F2FF" stroke="#1C77EB" stroke-width="2"/>
          <text x="18" y="26" fill="#1C77EB" font-size="19" text-anchor="middle" font-weight="700">3</text>
          <text x="58" y="26" fill="#111111" font-size="30" font-weight="600">调整表达</text>
          <text x="510" y="24" fill="#7D8591" font-size="23" text-anchor="end">不造事实</text>
        </g>
        <path d="M0 438H510" stroke="#DFE1E6" stroke-width="2"/>
        <text x="0" y="488" fill="#1C77EB" font-size="24" font-weight="600">同一份经历</text>
        <text x="510" y="488" fill="#111111" font-size="24" text-anchor="end" font-weight="600">按岗位重排</text>
      </g>
    </g>
  </g>

  <g id="actual-ui-layer" filter="url(#screenShadow)">
    <rect x="712" y="612" width="466" height="964" rx="38" fill="#FFFFFF"/>
    <image id="actual-h5-landing" xlink:href="assets/actual-h5-landing-393x852.png" x="732" y="632" width="426" height="924" preserveAspectRatio="xMidYMid slice" clip-path="url(#landingClip)"/>
  </g>

  <g id="legal-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="0" y="1584" width="1242" height="76" fill="#FFFFFF" fill-opacity="0.95"/>
    <text x="90" y="1631" fill="#7D8591" font-size="22">AI 初稿仅供参考，提交前请逐项核对事实。</text>
    <text x="1152" y="1631" fill="#1C77EB" font-size="22" text-anchor="end" font-weight="600">REF / W1-01</text>
  </g>

  <g id="safe-area-guide" style="display:none">
    <rect x="90" y="100" width="1062" height="1450" fill="none" stroke="#FF6037" stroke-width="2" stroke-dasharray="12 12"/>
  </g>
</svg>
