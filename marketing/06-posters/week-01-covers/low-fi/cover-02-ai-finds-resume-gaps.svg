<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1242" height="1660" viewBox="0 0 1242 1660" role="img" aria-labelledby="title desc">
  <title id="title">Reffo 小红书低保真封面 B：AI 先找简历差距</title>
  <desc id="desc">以 Reffo 实际结果页岗位分析顶部为主证据，表达 AI 先指出简历与岗位之间尚未证明的差距。</desc>
  <defs>
    <linearGradient id="atmosphereB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF4FB"/>
      <stop offset="0.54" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadowB" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#151E2E" flood-opacity="0.16"/>
    </filter>
    <clipPath id="resultClipB">
      <rect x="116" y="788" width="1010" height="760" rx="28"/>
    </clipPath>
  </defs>

  <g id="background-layer">
    <rect width="1242" height="1660" fill="url(#atmosphereB)"/>
    <rect x="0" y="628" width="1242" height="462" fill="#FFE0ED" fill-opacity="0.68"/>
    <path d="M0 1090C274 1042 462 1126 706 1076C930 1030 1058 966 1242 1004V1660H0Z" fill="#FFFFFF" fill-opacity="0.76"/>
  </g>

  <g id="brand-layer" fill="#1C77EB">
    <g transform="translate(90 92) scale(0.76)">
      <path d="M48 36C48 42.0751 43.0751 47 37 47C30.9249 47 26 42.0751 26 36C26 29.9249 30.9249 25 37 25C43.0751 25 48 29.9249 48 36Z"/>
      <path d="M0 25V47H10C15.6 47 17.6667 40.6667 18 37.5V22C18 19.6 20 19.3333 21 19.5H29.5C34.7 19.5 37.3333 13.8333 38 11V0H26C22.8 0 20.6667 2 20 3C14.6667 8 3.6 18.4 2 20C0.4 21.6 0 24 0 25Z"/>
    </g>
    <text x="142" y="131" font-family="Arial Rounded MT Bold, Avenir Next, Arial, sans-serif" font-size="51" font-weight="700" letter-spacing="-2">reffo</text>
  </g>

  <g id="draft-label" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="998" y="94" width="154" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.80" stroke="#AAC0DF" stroke-width="2"/>
    <text x="1075" y="126" fill="#4B4F56" font-size="21" text-anchor="middle" font-weight="500">低保真 / B</text>
  </g>

  <g id="copy-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <circle cx="100" cy="237" r="8" fill="#1C77EB"/>
    <text x="124" y="246" fill="#4B4F56" font-size="26" font-weight="500">第 1 周 · 产品透明</text>
    <text x="90" y="398" fill="#111111" font-size="112" font-weight="600" letter-spacing="-3">
      <tspan x="90" dy="0">AI先找</tspan>
      <tspan x="90" dy="128" fill="#1C77EB">简历差距</tspan>
    </text>
    <rect x="84" y="552" width="525" height="30" rx="15" fill="#FFE0ED"/>
    <text x="94" y="657" fill="#4B4F56" font-size="36">
      <tspan x="94">先指出</tspan><tspan fill="#111111" font-weight="600">哪里没证明</tspan><tspan>，再谈怎么改</tspan>
    </text>
  </g>

  <g id="analysis-key" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="820" y="310" width="332" height="230" rx="24" fill="#FFFFFF" fill-opacity="0.82" stroke="#DFE1E6" stroke-width="2"/>
    <text x="854" y="360" fill="#7D8591" font-size="22" font-weight="500">关注的是材料证据</text>
    <text x="854" y="424" fill="#111111" font-size="30" font-weight="600">匹配点</text>
    <circle cx="1090" cy="414" r="10" fill="#14C972"/>
    <text x="854" y="484" fill="#111111" font-size="30" font-weight="600">未证明项</text>
    <circle cx="1090" cy="474" r="10" fill="#FFE0ED" stroke="#D77A9D" stroke-width="2"/>
  </g>

  <g id="actual-ui-frame" filter="url(#shadowB)">
    <rect x="92" y="764" width="1058" height="798" rx="40" fill="#FFFFFF"/>
    <image id="actual-h5-result-header" xlink:href="assets/actual-h5-result-header-393x340.png" x="116" y="788" width="1010" height="760" preserveAspectRatio="xMidYMin slice" clip-path="url(#resultClipB)"/>
  </g>

  <g id="evidence-annotation" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="92" y="708" width="288" height="62" rx="31" fill="#111317"/>
    <text x="236" y="748" fill="#FFFFFF" font-size="24" text-anchor="middle" font-weight="600">实际 H5 · 岗位分析</text>
    <path d="M1068 684V748H1012" fill="none" stroke="#1C77EB" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1012" cy="748" r="7" fill="#1C77EB"/>
    <text x="1070" y="648" fill="#1C77EB" font-size="23" text-anchor="end" font-weight="600">产品内参考评分</text>
  </g>

  <g id="legal-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="0" y="1586" width="1242" height="74" fill="#FFFFFF" fill-opacity="0.94"/>
    <text x="90" y="1631" fill="#7D8591" font-size="22">评分不是招聘结论；AI 初稿请逐项核对。</text>
    <text x="1152" y="1631" fill="#1C77EB" font-size="22" text-anchor="end" font-weight="600">REF / W1-02</text>
  </g>
