<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1242" height="1660" viewBox="0 0 1242 1660" role="img" aria-labelledby="title desc">
  <title id="title">Reffo 小红书低保真封面 C：JD 不是关键词表</title>
  <desc id="desc">以可编辑的岗位要求排序框架配合实际 Reffo 岗位分析页面，表达理解岗位要求优先级比堆关键词更重要。</desc>
  <defs>
    <linearGradient id="atmosphereC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE9F9"/>
      <stop offset="0.33" stop-color="#EEF4FB"/>
      <stop offset="0.7" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadowC" x="-25%" y="-25%" width="170%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#151E2E" flood-opacity="0.14"/>
    </filter>
    <clipPath id="resultClipC">
      <rect x="666" y="902" width="470" height="406" rx="24"/>
    </clipPath>
  </defs>

  <g id="background-layer">
    <rect width="1242" height="1660" fill="url(#atmosphereC)"/>
    <text x="1234" y="768" fill="#1C77EB" fill-opacity="0.045" font-family="Arial Black, Arial, sans-serif" font-size="520" text-anchor="end" font-weight="900" letter-spacing="-34">JD</text>
    <path d="M0 738C224 706 428 754 642 716C886 674 1042 600 1242 636V1660H0Z" fill="#FFFFFF" fill-opacity="0.42"/>
  </g>

  <g id="brand-layer" fill="#1C77EB">
    <g transform="translate(90 92) scale(0.76)">
      <path d="M48 36C48 42.0751 43.0751 47 37 47C30.9249 47 26 42.0751 26 36C26 29.9249 30.9249 25 37 25C43.0751 25 48 29.9249 48 36Z"/>
      <path d="M0 25V47H10C15.6 47 17.6667 40.6667 18 37.5V22C18 19.6 20 19.3333 21 19.5H29.5C34.7 19.5 37.3333 13.8333 38 11V0H26C22.8 0 20.6667 2 20 3C14.6667 8 3.6 18.4 2 20C0.4 21.6 0 24 0 25Z"/>
    </g>
    <text x="142" y="131" font-family="Arial Rounded MT Bold, Avenir Next, Arial, sans-serif" font-size="51" font-weight="700" letter-spacing="-2">reffo</text>
  </g>

  <g id="draft-label" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="998" y="94" width="154" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.78" stroke="#AAC0DF" stroke-width="2"/>
    <text x="1075" y="126" fill="#4B4F56" font-size="21" text-anchor="middle" font-weight="500">低保真 / C</text>
  </g>

  <g id="copy-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <circle cx="100" cy="237" r="8" fill="#1C77EB"/>
    <text x="124" y="246" fill="#4B4F56" font-size="26" font-weight="500">第 1 周 · JD 拆解</text>
    <text x="90" y="398" fill="#111111" font-size="112" font-weight="600" letter-spacing="-3">
      <tspan x="90" dy="0">JD不是</tspan>
      <tspan x="90" dy="128" fill="#1C77EB">关键词表</tspan>
    </text>
    <text x="94" y="656" fill="#4B4F56" font-size="38">
      <tspan fill="#111111" font-weight="600">排序</tspan><tspan>，比堆词更重要</tspan>
    </text>
  </g>

  <g id="framework-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="90" y="804" fill="#7D8591" font-size="23" font-weight="500">内容框架示意 · 非产品界面</text>
    <g transform="translate(90 846)">
      <rect width="522" height="172" rx="24" fill="#111317"/>
      <text x="34" y="58" fill="#FFFFFF" fill-opacity="0.52" font-size="22">01 / MUST</text>
      <text x="34" y="120" fill="#FFFFFF" font-size="42" font-weight="600">必需</text>
      <text x="472" y="112" fill="#FFFFFF" font-size="29" text-anchor="end">先证明</text>
    </g>
    <g transform="translate(90 1042)">
      <rect width="522" height="172" rx="24" fill="#FFFFFF" stroke="#1C77EB" stroke-width="3"/>
      <text x="34" y="58" fill="#1C77EB" font-size="22">02 / PRIORITY</text>
      <text x="34" y="120" fill="#111111" font-size="42" font-weight="600">优先</text>
      <text x="472" y="112" fill="#4B4F56" font-size="29" text-anchor="end">再前置</text>
    </g>
    <g transform="translate(90 1238)">
      <rect width="522" height="172" rx="24" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="2"/>
      <text x="34" y="58" fill="#7D8591" font-size="22">03 / BONUS</text>
      <text x="34" y="120" fill="#111111" font-size="42" font-weight="600">加分</text>
      <text x="472" y="112" fill="#4B4F56" font-size="29" text-anchor="end">最后补充</text>
    </g>
  </g>

  <g id="actual-ui-layer" filter="url(#shadowC)">
    <rect x="642" y="878" width="518" height="454" rx="32" fill="#FFFFFF"/>
    <image id="actual-h5-result-header" xlink:href="assets/actual-h5-result-header-393x340.png" x="666" y="902" width="470" height="406" preserveAspectRatio="xMidYMid slice" clip-path="url(#resultClipC)"/>
  </g>

  <g id="evidence-annotation" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="790" y="830" width="322" height="62" rx="31" fill="#1C77EB"/>
    <text x="951" y="870" fill="#FFFFFF" font-size="24" text-anchor="middle" font-weight="600">实际 H5 · 岗位分析</text>
    <path d="M698 1360H1138" stroke="#AAC0DF" stroke-width="2" stroke-dasharray="10 12"/>
    <text x="1138" y="1408" fill="#4B4F56" font-size="26" text-anchor="end">先理解要求，再对齐证据</text>
  </g>

  <g id="legal-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="0" y="1586" width="1242" height="74" fill="#FFFFFF" fill-opacity="0.94"/>
    <text x="90" y="1631" fill="#7D8591" font-size="22">材料未证明，不等于你不具备；AI 初稿请核对。</text>
    <text x="1152" y="1631" fill="#1C77EB" font-size="22" text-anchor="end" font-weight="600">REF / W1-03</text>
  </g>
</svg>
