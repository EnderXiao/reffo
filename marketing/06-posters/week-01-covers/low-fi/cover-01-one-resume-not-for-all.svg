<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1242" height="1660" viewBox="0 0 1242 1660" role="img" aria-labelledby="title desc">
  <title id="title">Reffo 小红书低保真封面 A：一份简历别横投</title>
  <desc id="desc">左侧为可编辑中文标题，右侧使用 Reffo 实际运行的脱敏 Landing 页面截图，表达一份简历不应直接横投不同岗位。</desc>
  <defs>
    <linearGradient id="atmosphereA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE9F9"/>
      <stop offset="0.36" stop-color="#EEF4FB"/>
      <stop offset="0.68" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadowA" x="-30%" y="-20%" width="180%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#151E2E" flood-opacity="0.16"/>
    </filter>
    <clipPath id="landingClipA">
      <rect x="704" y="628" width="454" height="984" rx="30"/>
    </clipPath>
  </defs>

  <g id="background-layer">
    <rect width="1242" height="1660" fill="url(#atmosphereA)"/>
    <path d="M0 780C268 718 468 756 665 718C890 675 1060 578 1242 612V1660H0Z" fill="#FFFFFF" fill-opacity="0.48"/>
    <path d="M86 619H588" stroke="#AAC0DF" stroke-width="2" stroke-dasharray="10 14"/>
  </g>

  <g id="brand-layer" fill="#1C77EB">
    <g transform="translate(90 92) scale(0.76)">
      <path d="M48 36C48 42.0751 43.0751 47 37 47C30.9249 47 26 42.0751 26 36C26 29.9249 30.9249 25 37 25C43.0751 25 48 29.9249 48 36Z"/>
      <path d="M0 25V47H10C15.6 47 17.6667 40.6667 18 37.5V22C18 19.6 20 19.3333 21 19.5H29.5C34.7 19.5 37.3333 13.8333 38 11V0H26C22.8 0 20.6667 2 20 3C14.6667 8 3.6 18.4 2 20C0.4 21.6 0 24 0 25Z"/>
    </g>
    <text x="142" y="131" font-family="Arial Rounded MT Bold, Avenir Next, Arial, sans-serif" font-size="51" font-weight="700" letter-spacing="-2">reffo</text>
  </g>

  <g id="draft-label" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="998" y="94" width="154" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.76" stroke="#AAC0DF" stroke-width="2"/>
    <text x="1075" y="126" fill="#4B4F56" font-size="21" text-anchor="middle" font-weight="500">低保真 / A</text>
  </g>

  <g id="copy-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <g id="series-label">
      <circle cx="100" cy="237" r="8" fill="#1C77EB"/>
      <text x="124" y="246" fill="#4B4F56" font-size="26" font-weight="500" letter-spacing="1">第 1 周 · 一岗一简历</text>
    </g>
    <text x="90" y="398" fill="#111111" font-size="112" font-weight="600" letter-spacing="-3">
      <tspan x="90" dy="0">一份简历</tspan>
      <tspan x="90" dy="128" fill="#1C77EB">别横投</tspan>
    </text>
    <text x="94" y="655" fill="#4B4F56" font-size="38" font-weight="400">
      <tspan x="94">换岗位，</tspan>
      <tspan fill="#111111" font-weight="600">先换证据顺序</tspan>
    </text>
    <text x="94" y="722" fill="#7D8591" font-size="26">不是只改文件名，也不是先换模板。</text>
  </g>

  <g id="application-card-metaphor" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <g transform="translate(64 856) rotate(-6 264 336)" opacity="0.62">
      <rect width="528" height="672" rx="28" fill="#E5F2FF" stroke="#AAC0DF" stroke-width="2"/>
      <text x="44" y="68" fill="#1C77EB" font-size="24" font-weight="600">岗位档案 / 01</text>
      <text x="44" y="144" fill="#111111" font-size="46" font-weight="600">同一段经历</text>
      <rect x="44" y="212" width="284" height="18" rx="9" fill="#1C77EB" fill-opacity="0.28"/>
      <rect x="44" y="258" width="394" height="14" rx="7" fill="#111111" fill-opacity="0.14"/>
      <rect x="44" y="294" width="344" height="14" rx="7" fill="#111111" fill-opacity="0.10"/>
    </g>
    <g transform="translate(118 900) rotate(2 264 336)">
      <rect width="528" height="672" rx="28" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="2" filter="url(#shadowA)"/>
      <text x="44" y="70" fill="#7D8591" font-size="24" font-weight="500">内容结构示意 · 非产品界面</text>
      <text x="44" y="150" fill="#111111" font-size="48" font-weight="600">先看岗位要什么</text>
      <path d="M44 208H484" stroke="#DFE1E6" stroke-width="2"/>
      <text x="44" y="278" fill="#1C77EB" font-size="30" font-weight="600">01  对应职责</text>
      <text x="44" y="350" fill="#111111" font-size="30" font-weight="500">02  前置证据</text>
      <text x="44" y="422" fill="#111111" font-size="30" font-weight="500">03  调整表达</text>
      <rect x="44" y="504" width="224" height="58" rx="29" fill="#1C77EB"/>
      <text x="156" y="543" fill="#FFFFFF" font-size="25" text-anchor="middle" font-weight="600">一岗一版</text>
    </g>
  </g>

  <g id="actual-ui-layer" filter="url(#shadowA)">
    <rect x="688" y="612" width="486" height="1016" rx="38" fill="#FFFFFF"/>
    <image id="actual-h5-landing" xlink:href="assets/actual-h5-landing-393x852.png" x="704" y="628" width="454" height="984" preserveAspectRatio="xMidYMid slice" clip-path="url(#landingClipA)"/>
  </g>

  <g id="evidence-annotation" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <path d="M618 802H676V744H728" fill="none" stroke="#1C77EB" stroke-width="3" stroke-linecap="round"/>
    <circle cx="728" cy="744" r="7" fill="#1C77EB"/>
    <rect x="392" y="770" width="226" height="64" rx="32" fill="#FFFFFF" stroke="#1C77EB" stroke-width="2"/>
    <text x="505" y="811" fill="#1C77EB" font-size="24" text-anchor="middle" font-weight="600">实际 H5 画面</text>
  </g>

  <g id="legal-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="0" y="1586" width="1242" height="74" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="90" y="1631" fill="#7D8591" font-size="22">AI 初稿，请逐项核对事实。</text>
    <text x="1152" y="1631" fill="#1C77EB" font-size="22" text-anchor="end" font-weight="600">REF / W1-01</text>
  </g>
</svg>
