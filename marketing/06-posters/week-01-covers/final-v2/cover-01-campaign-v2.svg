<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1242" height="1660" viewBox="0 0 1242 1660" role="img" aria-labelledby="title desc">
  <title id="title">Reffo 产品宣传图</title>
  <desc id="desc">真实岗位分析界面、标题、三项产品卖点与行动引导组成的克制型社交媒体宣传图。</desc>
  <defs>
    <filter id="ambientShadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#17365F" flood-opacity="0.14"/>
    </filter>
    <filter id="buttonShadow" x="-30%" y="-50%" width="170%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1C77EB" flood-opacity="0.20"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="526" y="232" width="630" height="545" rx="25"/>
    </clipPath>
    <clipPath id="acrylicClip">
      <rect x="430" y="0" width="812" height="880"/>
    </clipPath>
  </defs>

  <g id="background">
    <rect width="1242" height="1660" fill="#F8FAFD"/>
    <ellipse cx="865" cy="800" rx="316" ry="42" fill="#17365F" fill-opacity="0.07"/>
  </g>

  <g id="generated-material" opacity="0.34" clip-path="url(#acrylicClip)">
    <image id="imagegen-acrylic" xlink:href="assets/acrylic-fold-imagegen-v1.png" x="430" y="240" width="742" height="1113" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="brand">
    <image id="official-reffo-logo" xlink:href="assets/reffo-logo.png" x="90" y="88" width="180" height="48" preserveAspectRatio="xMinYMid meet"/>
  </g>

  <g id="headline" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="88" y="330" fill="#101217" font-size="82" font-weight="600" letter-spacing="-2.6">
      <tspan x="88" dy="0">不同岗位，</tspan>
      <tspan x="88" dy="100">需要不同的</tspan>
      <tspan x="88" dy="100" fill="#1C77EB">简历重点</tspan>
    </text>
    <text x="92" y="646" fill="#5B6470" font-size="31" font-weight="400" letter-spacing="0.2">
      <tspan x="92" dy="0">先看岗位差距，</tspan>
      <tspan x="92" dy="50">再重排已有经历</tspan>
    </text>
  </g>

  <g id="app-interface" filter="url(#ambientShadow)">
    <rect x="500" y="206" width="682" height="597" rx="34" fill="#FFFFFF"/>
    <rect x="501.5" y="207.5" width="679" height="594" rx="32.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.88" stroke-width="3"/>
    <image id="actual-h5-result" xlink:href="assets/actual-h5-result-header-393x340.png" x="526" y="232" width="630" height="545" preserveAspectRatio="xMidYMid meet" clip-path="url(#screenClip)"/>
  </g>

  <g id="selling-points" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <g transform="translate(650 936)">
      <rect x="0" y="19" width="12" height="12" rx="3" fill="#1C77EB"/>
      <text x="38" y="42" fill="#101217" font-size="38" font-weight="500">岗位差距分析</text>
      <path d="M0 78H492" stroke="#DDE3EB" stroke-width="2"/>
    </g>
    <g transform="translate(650 1052)">
      <rect x="0" y="19" width="12" height="12" rx="3" fill="#1C77EB"/>
      <text x="38" y="42" fill="#101217" font-size="38" font-weight="500">已有证据重排</text>
      <path d="M0 78H492" stroke="#DDE3EB" stroke-width="2"/>
    </g>
    <g transform="translate(650 1168)">
      <rect x="0" y="19" width="12" height="12" rx="3" fill="#1C77EB"/>
      <text x="38" y="42" fill="#101217" font-size="38" font-weight="500">生成可编辑版本</text>
    </g>
  </g>

  <g id="call-to-action" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" filter="url(#buttonShadow)">
    <rect x="650" y="1320" width="252" height="82" rx="41" fill="#1C77EB"/>
    <text x="776" y="1373" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle" letter-spacing="1">开始创建</text>
  </g>
</svg>
