<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1242" height="1660" viewBox="0 0 1242 1660" role="img" aria-labelledby="title desc">
  <title id="title">Reffo 小红书封面低保真，缺的不是词是证据</title>
  <desc id="desc">标题置于上方大面积留白，真实 H5 岗位分析页从左下方裁切出画，右侧只保留两步证据索引。</desc>
  <defs>
    <linearGradient id="bg03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE9F9"/>
      <stop offset="0.32" stop-color="#EEF4FB"/>
      <stop offset="0.66" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="screenShadow03" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#151E2E" flood-opacity="0.16"/>
    </filter>
    <filter id="buttonShadow03" x="-35%" y="-60%" width="170%" height="230%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#286FE7" flood-opacity="0.18"/>
    </filter>
    <clipPath id="screenClip03">
      <rect x="-40" y="706" width="1120" height="970" rx="36"/>
    </clipPath>
  </defs>

  <g id="background-layer">
    <rect width="1242" height="1660" fill="url(#bg03)"/>
  </g>

  <g id="brand-layer">
    <image x="90" y="92" width="168" height="44" preserveAspectRatio="xMinYMid meet" xlink:href="assets/reffo-logo.png"/>
    <g transform="translate(90 202)" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
      <rect x="0" y="0" width="5" height="34" rx="2.5" fill="#1C77EB"/>
      <text x="24" y="28" fill="#4B4F56" font-size="27" font-weight="500" letter-spacing="1">JD 拆解</text>
    </g>
  </g>

  <g id="copy-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="90" y="392" fill="#111111" font-size="102" font-weight="600" letter-spacing="-3">
      <tspan x="90" dy="0">缺的不是词，</tspan>
      <tspan x="90" dy="122">是</tspan><tspan fill="#1C77EB">证据</tspan>
    </text>
    <text x="92" y="614" fill="#4B4F56" font-size="35" font-weight="400">对照 JD，找出没有证据的要求</text>

    <g id="cta" transform="translate(886 522)" filter="url(#buttonShadow03)">
      <rect x="0" y="0" width="266" height="80" rx="40" fill="#286FE7"/>
      <text x="133" y="53" fill="#FFFFFF" font-size="30" font-weight="600" text-anchor="middle">开始创建</text>
    </g>
  </g>

  <g id="product-screenshot-layer" filter="url(#screenShadow03)">
    <rect x="-70" y="676" width="1180" height="1030" rx="50" fill="#FFFFFF"/>
    <g clip-path="url(#screenClip03)">
      <image x="-40" y="706" width="1120" height="970" preserveAspectRatio="xMidYMid slice" xlink:href="assets/actual-h5-result-header-393x340.png"/>
    </g>
  </g>

  <g id="evidence-index" transform="translate(1038 716)" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="0" y="0" width="254" height="704" rx="32" fill="#111317"/>
    <text x="34" y="66" fill="#FFFFFF" fill-opacity="0.56" font-size="23" font-weight="500">检查顺序</text>
    <text x="34" y="166" fill="#FFFFFF" fill-opacity="0.52" font-size="24">01</text>
    <text x="34" y="218" fill="#FFFFFF" font-size="30" font-weight="600">提取要求</text>
    <path d="M34 276H220" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="2"/>
    <text x="34" y="368" fill="#FFFFFF" fill-opacity="0.52" font-size="24">02</text>
    <text x="34" y="420" fill="#FFFFFF" font-size="30" font-weight="600">对照材料</text>
    <circle cx="38" cy="616" r="7" fill="#1C77EB"/>
    <rect x="62" y="610" width="126" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.62"/>
  </g>

  <g id="legal-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="90" y="1560" width="742" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.82"/>
    <text x="112" y="1592" fill="#7D8591" font-size="21">材料未证明，不等于你不具备；AI 分析请核对。</text>
  </g>
</svg>
