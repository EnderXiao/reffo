<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1242" height="1660" viewBox="0 0 1242 1660" role="img" aria-labelledby="title desc">
  <title id="title">Reffo 小红书封面低保真，换个岗位差距会变</title>
  <desc id="desc">当前 Reffo H5 Landing 真实截图作为右侧主视觉，左侧精确排版中文标题与行动按钮。</desc>
  <defs>
    <linearGradient id="bg01" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF4FB"/>
      <stop offset="0.48" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="leftVeil01" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F9FB" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#F8F9FB" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#F8F9FB" stop-opacity="0"/>
    </linearGradient>
    <filter id="screenShadow01" x="-25%" y="-15%" width="155%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#151E2E" flood-opacity="0.15"/>
    </filter>
    <filter id="buttonShadow01" x="-35%" y="-60%" width="170%" height="230%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#286FE7" flood-opacity="0.18"/>
    </filter>
    <clipPath id="screenClip01">
      <rect x="615" y="86" width="714" height="1518" rx="42"/>
    </clipPath>
  </defs>

  <g id="background-layer">
    <rect width="1242" height="1660" fill="url(#bg01)"/>
    <rect x="0" y="0" width="690" height="1660" fill="url(#leftVeil01)"/>
  </g>

  <g id="product-screenshot-layer" filter="url(#screenShadow01)">
    <rect x="589" y="60" width="766" height="1570" rx="52" fill="#FFFFFF"/>
    <g clip-path="url(#screenClip01)">
      <image x="615" y="86" width="714" height="1548" preserveAspectRatio="xMidYMid slice" xlink:href="assets/actual-h5-landing-393x852.png"/>
    </g>
  </g>

  <g id="brand-layer">
    <image x="90" y="92" width="168" height="44" preserveAspectRatio="xMinYMid meet" xlink:href="assets/reffo-logo.png"/>
    <g transform="translate(90 202)" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
      <rect x="0" y="0" width="5" height="34" rx="2.5" fill="#1C77EB"/>
      <text x="24" y="28" fill="#4B4F56" font-size="27" font-weight="500" letter-spacing="1">一岗一简历</text>
    </g>
  </g>

  <g id="copy-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="90" y="405" fill="#111111" font-size="104" font-weight="600" letter-spacing="-3">
      <tspan x="90" dy="0">换个岗位，</tspan>
      <tspan x="90" dy="126" fill="#1C77EB">差距会变</tspan>
    </text>
    <text x="92" y="682" fill="#4B4F56" font-size="35" font-weight="400" letter-spacing="0">按目标岗位，重新检查已有材料</text>

    <g id="selling-points" transform="translate(92 836)" fill="#111111" font-size="32" font-weight="500">
      <circle cx="8" cy="-9" r="7" fill="#1C77EB"/>
      <text x="34" y="0">看见岗位差距</text>
      <circle cx="8" cy="73" r="7" fill="#1C77EB"/>
      <text x="34" y="82">重排已有证据</text>
    </g>

    <g id="cta" transform="translate(90 1276)" filter="url(#buttonShadow01)">
      <rect x="0" y="0" width="272" height="82" rx="41" fill="#286FE7"/>
      <text x="136" y="54" fill="#FFFFFF" font-size="31" font-weight="600" text-anchor="middle">开始创建</text>
    </g>
  </g>

  <g id="index-rail" transform="translate(1132 220)">
    <rect x="0" y="0" width="4" height="146" rx="2" fill="#1C77EB"/>
    <rect x="0" y="178" width="4" height="62" rx="2" fill="#AAC0DF"/>
    <rect x="0" y="272" width="4" height="34" rx="2" fill="#DFE1E6"/>
  </g>

  <g id="legal-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="90" y="1574" fill="#7D8591" font-size="21">AI 初稿，请逐项核对事实。</text>
  </g>
</svg>
