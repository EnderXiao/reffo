<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660" role="img" aria-labelledby="title desc">
  <title id="title">Reffo 小红书封面模板</title>
  <desc id="desc">三比四封面，可编辑中文标题，包含真实 H5 截图占位区与岗位档案卡辅助图形。</desc>
  <defs>
    <linearGradient id="atmosphere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE9F9"/>
      <stop offset="0.34" stop-color="#EEF4FB"/>
      <stop offset="0.62" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#151E2E" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#286FE7" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g id="background-layer">
    <rect width="1242" height="1660" fill="url(#atmosphere)"/>
    <path d="M0 724C238 666 412 705 612 682C872 652 1050 558 1242 580V1660H0Z" fill="#FFFFFF" fill-opacity="0.42"/>
    <g opacity="0.055" fill="#1C77EB" transform="translate(1042 128) scale(2.6)">
      <path d="M48 36C48 42.0751 43.0751 47 37 47C30.9249 47 26 42.0751 26 36C26 29.9249 30.9249 25 37 25C43.0751 25 48 29.9249 48 36Z"/>
      <path d="M0 25V47H10C15.6 47 17.6667 40.6667 18 37.5V22C18 19.6 20 19.3333 21 19.5H29.5C34.7 19.5 37.3333 13.8333 38 11V0H26C22.8 0 20.6667 2 20 3C14.6667 8 3.6 18.4 2 20C0.4 21.6 0 24 0 25Z"/>
    </g>
  </g>

  <g id="brand-layer" fill="#1C77EB">
    <g transform="translate(90 92) scale(0.76)">
      <path d="M48 36C48 42.0751 43.0751 47 37 47C30.9249 47 26 42.0751 26 36C26 29.9249 30.9249 25 37 25C43.0751 25 48 29.9249 48 36Z"/>
      <path d="M0 25V47H10C15.6 47 17.6667 40.6667 18 37.5V22C18 19.6 20 19.3333 21 19.5H29.5C34.7 19.5 37.3333 13.8333 38 11V0H26C22.8 0 20.6667 2 20 3C14.6667 8 3.6 18.4 2 20C0.4 21.6 0 24 0 25Z"/>
    </g>
    <text x="142" y="131" font-family="Arial Rounded MT Bold, Avenir Next, Arial, sans-serif" font-size="51" font-weight="700" letter-spacing="-2">reffo</text>
  </g>

  <g id="copy-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <g id="series-label">
      <rect x="90" y="206" width="306" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.78" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="121" cy="235" r="8" fill="#1C77EB"/>
      <text x="145" y="244" fill="#4B4F56" font-size="26" font-weight="500" letter-spacing="1">一岗一简历 · 证据重组</text>
    </g>
    <text x="90" y="390" fill="#111111" font-size="92" font-weight="600" letter-spacing="-2">
      <tspan x="90" dy="0">同一段经历，</tspan>
      <tspan x="90" dy="112">投</tspan><tspan fill="#1C77EB">两个岗位</tspan><tspan fill="#111111">，</tspan>
      <tspan x="90" dy="112"><tspan fill="#1C77EB">重点</tspan><tspan fill="#111111">怎么换？</tspan></tspan>
    </text>
    <text x="92" y="774" fill="#4B4F56" font-size="34" font-weight="400">
      <tspan x="92">先看 JD 真正在要的证据，</tspan>
      <tspan x="92" dy="52">再决定哪些经历应该前置。</tspan>
    </text>
  </g>

  <g id="graphic-layer" filter="url(#cardShadow)">
    <g transform="translate(738 824) rotate(7 174 274)">
      <rect x="0" y="0" width="348" height="548" rx="20" fill="#6DA9FF" opacity="0.38"/>
    </g>
    <g transform="translate(804 784) rotate(10 174 274)">
      <rect x="0" y="0" width="348" height="548" rx="20" fill="#111317"/>
      <rect x="0" y="356" width="348" height="192" rx="0" fill="#FFFFFF" fill-opacity="0.10"/>
      <path d="M0 356H348" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
      <text x="34" y="78" fill="#FFFFFF" fill-opacity="0.46" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">岗位档案</text>
      <text x="34" y="174" fill="#FFFFFF" font-family="Georgia, Times New Roman, serif" font-size="96">02</text>
      <rect x="34" y="400" width="172" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.72"/>
      <rect x="34" y="438" width="248" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.28"/>
      <rect x="34" y="468" width="208" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.20"/>
    </g>
  </g>

  <g id="screenshot-placeholder" filter="url(#softShadow)">
    <rect x="90" y="934" width="748" height="548" rx="28" fill="#FFFFFF" fill-opacity="0.92" stroke="#1C77EB" stroke-opacity="0.48" stroke-width="3" stroke-dasharray="14 12"/>
    <rect x="124" y="968" width="680" height="412" rx="18" fill="#EEF4FB"/>
    <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" text-anchor="middle">
      <text x="464" y="1120" fill="#1C77EB" font-size="34" font-weight="600">替换为真实 H5 截图</text>
      <text x="464" y="1174" fill="#7D8591" font-size="25">保持等比 · 不重画 UI · 发布前不可逆脱敏</text>
      <text x="464" y="1222" fill="#7D8591" font-size="25">截图内按钮、评分和功能名称不得修改</text>
    </g>
    <g transform="translate(398 1272)" stroke="#1C77EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="132" height="74" rx="12"/>
      <path d="M35 38L57 55L91 23"/>
    </g>
    <text x="124" y="1434" fill="#7D8591" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">真实界面证据区</text>
  </g>

  <g id="index-rail" transform="translate(1154 882)" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="-62" y="12" fill="#111111" font-size="24" font-weight="700">02</text>
    <rect x="0" y="0" width="28" height="4" rx="2" fill="#111111"/>
    <g fill="#AAB2BF">
      <rect x="12" y="62" width="16" height="3" rx="1.5"/>
      <rect x="18" y="124" width="10" height="3" rx="1.5"/>
      <rect x="12" y="186" width="16" height="3" rx="1.5"/>
      <rect x="18" y="248" width="10" height="3" rx="1.5"/>
      <rect x="12" y="310" width="16" height="3" rx="1.5"/>
      <rect x="18" y="372" width="10" height="3" rx="1.5"/>
      <rect x="12" y="434" width="16" height="3" rx="1.5"/>
    </g>
  </g>

  <g id="legal-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="90" y="1570" fill="#7D8591" font-size="22">AI 初稿，请逐项核对事实。</text>
    <text x="1152" y="1570" fill="#1C77EB" font-size="22" text-anchor="end" font-weight="600">REF / 01</text>
  </g>

  <g id="guide-layer" style="display:none">
    <rect x="90" y="100" width="1062" height="1450" fill="none" stroke="#FF6037" stroke-width="2" stroke-dasharray="12 12"/>
  </g>
</svg>
