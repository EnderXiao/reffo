<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660" role="img" aria-labelledby="title desc">
  <title id="title">Reffo 小红书轮播内页模板</title>
  <desc id="desc">适合原句、判断、动作三段式内容，所有中文可编辑。</desc>
  <defs>
    <linearGradient id="pageAtmosphere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF4FB"/>
      <stop offset="0.45" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#151E2E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g id="background-layer">
    <rect width="1242" height="1660" fill="url(#pageAtmosphere)"/>
  </g>

  <g id="brand-layer" fill="#1C77EB">
    <g transform="translate(90 86) scale(0.62)">
      <path d="M48 36C48 42.0751 43.0751 47 37 47C30.9249 47 26 42.0751 26 36C26 29.9249 30.9249 25 37 25C43.0751 25 48 29.9249 48 36Z"/>
      <path d="M0 25V47H10C15.6 47 17.6667 40.6667 18 37.5V22C18 19.6 20 19.3333 21 19.5H29.5C34.7 19.5 37.3333 13.8333 38 11V0H26C22.8 0 20.6667 2 20 3C14.6667 8 3.6 18.4 2 20C0.4 21.6 0 24 0 25Z"/>
    </g>
    <text x="133" y="119" font-family="Arial Rounded MT Bold, Avenir Next, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-2">reffo</text>
  </g>

  <g id="copy-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="1152" y="116" fill="#7D8591" font-size="24" text-anchor="end">JD 拆解 · 03 / 08</text>
    <text x="90" y="260" fill="#111111" font-size="72" font-weight="600" letter-spacing="-1">
      <tspan x="90">这条 JD 要的不是</tspan>
      <tspan x="90" dy="90"><tspan fill="#1C77EB">关键词</tspan><tspan fill="#111111">，而是证据</tspan></tspan>
    </text>
    <text x="92" y="468" fill="#4B4F56" font-size="31">用“原句 → 判断 → 动作”把一页讲清楚。</text>
  </g>

  <g id="content-cards" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" filter="url(#panelShadow)">
    <g id="source-card">
      <rect x="90" y="562" width="1062" height="254" rx="24" fill="#FFFFFF"/>
      <rect x="90" y="562" width="12" height="254" rx="6" fill="#1C77EB"/>
      <text x="138" y="626" fill="#1C77EB" font-size="25" font-weight="600">01 / JD 原句</text>
      <text x="138" y="692" fill="#111111" font-size="36" font-weight="600">“[粘贴已公开或已授权的 JD 原句]”</text>
      <text x="138" y="754" fill="#7D8591" font-size="26">不要只圈名词，先判断它在要求什么工作证据。</text>
    </g>

    <g id="judgement-card">
      <rect x="90" y="850" width="1062" height="254" rx="24" fill="#E0F8EC"/>
      <circle cx="144" cy="914" r="18" fill="#14C972"/>
      <path d="M135 914L142 921L154 906" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="184" y="924" fill="#087D48" font-size="25" font-weight="600">02 / 判断依据</text>
      <text x="138" y="990" fill="#111111" font-size="36" font-weight="600">[已有证据 / 表达缺口 / 真实能力缺口]</text>
      <text x="138" y="1052" fill="#4B4F56" font-size="26">只写能从源简历或用户确认中找到的依据。</text>
    </g>

    <g id="action-card">
      <rect x="90" y="1138" width="1062" height="254" rx="24" fill="#FFFFFF"/>
      <rect x="122" y="1178" width="176" height="52" rx="26" fill="#286FE7"/>
      <text x="210" y="1213" fill="#FFFFFF" font-size="24" font-weight="600" text-anchor="middle">03 / 下一步</text>
      <text x="138" y="1292" fill="#111111" font-size="36" font-weight="600">[前置哪段经历 / 补哪项数据 / 保留哪条边界]</text>
      <text x="138" y="1350" fill="#7D8591" font-size="26">动作必须能由用户核对和完成，不编故事。</text>
    </g>
  </g>

  <g id="legal-layer" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <path d="M90 1470H1152" stroke="#DFE1E6" stroke-width="2"/>
    <text x="90" y="1530" fill="#7D8591" font-size="23">AI 初稿，请逐项核对事实。</text>
    <text x="1152" y="1530" fill="#1C77EB" font-size="23" font-weight="600" text-anchor="end">一个岗位，一份经过你确认的简历。</text>
  </g>

  <g id="guide-layer" style="display:none">
    <rect x="90" y="100" width="1062" height="1450" fill="none" stroke="#FF6037" stroke-width="2" stroke-dasharray="12 12"/>
  </g>
</svg>
