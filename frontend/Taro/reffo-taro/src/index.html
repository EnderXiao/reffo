<!DOCTYPE html>
<html>
<head>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" name="viewport">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="%23101521"/><path d="M18 42V20h16c7 0 12 4 12 11S41 42 34 42H18zm8-7h8c3 0 5-1 5-4s-2-4-5-4h-8v8z" fill="%23ffffff"/></svg>'>
  <meta name="format-detection" content="telephone=no,address=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" >
  <title>reffo-taro</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    #reffo-home-boot-cover {
      position: fixed;
      z-index: 200;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #dce9f9 0%, #eef4fb 33%, #f8f9fb 58%, #ffffff 100%);
    }

    html[data-reffo-home-boot-cover='on'] #reffo-home-boot-cover {
      display: flex;
    }

    #reffo-home-boot-cover img {
      position: relative;
      z-index: 1;
      width: clamp(140px, 40vw, 180px);
      height: auto;
      aspect-ratio: 198 / 52;
      object-fit: contain;
      transform: translateY(-2vh);
      animation:
        reffo-home-boot-logo-in 520ms cubic-bezier(0.22, 1, 0.36, 1) both,
        reffo-home-boot-logo-breathe 1800ms ease-in-out 560ms infinite;
    }

    #reffo-home-boot-cover__loading {
      position: absolute;
      right: 0;
      bottom: max(30px, env(safe-area-inset-bottom));
      left: 0;
      z-index: 1;
      display: flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #reffo-home-boot-cover__loading span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(18, 118, 245, 0.72);
      animation: reffo-home-boot-dot 960ms ease-in-out infinite;
    }

    #reffo-home-boot-cover__loading span:nth-child(2) {
      animation-delay: 120ms;
    }

    #reffo-home-boot-cover__loading span:nth-child(3) {
      animation-delay: 240ms;
    }

    @keyframes reffo-home-boot-logo-in {
      from {
        opacity: 0;
        transform: translateY(calc(-2vh + 8px)) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(-2vh) scale(1);
      }
    }

    @keyframes reffo-home-boot-logo-breathe {
      0%,
      100% {
        transform: translateY(-2vh) scale(1);
      }

      50% {
        transform: translateY(-2vh) scale(1.018);
      }
    }

    @keyframes reffo-home-boot-dot {
      0%,
      80%,
      100% {
        opacity: 0.34;
        transform: translateY(0) scale(0.82);
      }

      40% {
        opacity: 1;
        transform: translateY(-3px) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #reffo-home-boot-cover img,
      #reffo-home-boot-cover__loading span {
        animation: none;
      }
    }
  </style>
  <script><%= htmlWebpackPlugin.options.script %></script>
  <script>
    (function () {
      var routeHash = window.location.hash || ''
      if (routeHash.indexOf('#/pages/index/index') === 0) {
        document.documentElement.dataset.reffoHomeBootCover = 'on'
      }

      var isStandalone = window.navigator.standalone === true
        || window.matchMedia('(display-mode: standalone)').matches
        || window.matchMedia('(display-mode: fullscreen)').matches
      if (isStandalone) {
        document.documentElement.classList.add('reffo-standalone')
      }

      var DESIGN_WIDTH = 393
      var BASE_FONT_SIZE = 20
      var MIN_ROOT_SIZE = 14
      var MAX_ROOT_SIZE = 24

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value))
      }

      function getViewportSize() {
        var viewport = window.visualViewport
        var documentElement = document.documentElement
        return {
          width: viewport && viewport.width ? viewport.width : documentElement.clientWidth,
          height: viewport && viewport.height ? viewport.height : documentElement.clientHeight,
        }
      }

      function refreshRootFontSize() {
        var size = getViewportSize()
        var effectiveWidth = Math.min(size.width, DESIGN_WIDTH)
        var nextFontSize = BASE_FONT_SIZE * (effectiveWidth / DESIGN_WIDTH)

        document.documentElement.style.fontSize = clamp(nextFontSize, MIN_ROOT_SIZE, MAX_ROOT_SIZE) + 'px'
      }

      function scheduleRefresh() {
        window.requestAnimationFrame(refreshRootFontSize)
      }

      refreshRootFontSize()
      window.addEventListener('resize', scheduleRefresh)
      window.addEventListener('orientationchange', scheduleRefresh)
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleRefresh)
        window.visualViewport.addEventListener('scroll', scheduleRefresh)
      }
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="reffo-home-boot-cover" role="status" aria-label="正在加载首页数据" aria-busy="true">
    <img src="/static/images/assets/branding/reffo-logo.png" alt="Reffo">
    <div id="reffo-home-boot-cover__loading" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</body>
</html>
