name: Production Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-migration-release:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            exit 0
          fi

          valid=false
          for branch in main master; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git fetch --no-tags origin "$branch"
              if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
                valid=true
              fi
            fi
          done
          if [[ "$valid" != "true" ]]; then
            echo "版本 tag 必须指向 main 或 master 分支包含的 commit"
            exit 1
          fi

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
              echo "非法版本 tag: $GITHUB_REF_NAME"
              exit 1
            }
            version="${GITHUB_REF_NAME#v}"
            subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/${GITHUB_REF_NAME}")"
            body="$(git for-each-ref --format='%(contents:body)' "refs/tags/${GITHUB_REF_NAME}")"
            notes="$subject"
            [ -z "$body" ] || notes="${subject}"$'\n\n'"${body}"
            [ -n "$notes" ] || notes="版本 ${version}"
          else
            base_version="$(node -p "require('./frontend/Taro/reffo-taro/package.json').version")"
            version="${base_version}-${GITHUB_REF_NAME}.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}"
            notes="${GITHUB_REF_NAME} 分支第 ${GITHUB_RUN_NUMBER} 次正式发布，commit ${GITHUB_SHA}"
          fi
          {
            echo "version=${version}"
            echo 'notes<<EOF'
            echo "$notes"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/Taro/reffo-taro/pnpm-lock.yaml

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install frontend dependencies
        working-directory: frontend/Taro/reffo-taro
        run: pnpm install --frozen-lockfile

      - name: Test backend
        working-directory: backend
        run: |
          bun install --frozen-lockfile
          bunx --no-install tsc --noEmit
          bun test ./src

      - name: Build H5
        working-directory: frontend/Taro/reffo-taro
        env:
          REFFO_VERSION: ${{ steps.metadata.outputs.version }}
          REFFO_RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
        run: pnpm build:h5:prod

      - name: Validate Supabase migration inventory
        run: bash .github/scripts/supabase-migrate.sh --check-only

      - name: Apply production Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
          SUPABASE_MIGRATION_ENV: production
          SUPABASE_CLI: backend/node_modules/.bin/supabase
        run: bash .github/scripts/supabase-migrate.sh

      - name: Trigger Render deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL 未配置，不能将此版本标记为已触发发布"
            exit 1
          fi
          curl --fail --retry 3 -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
