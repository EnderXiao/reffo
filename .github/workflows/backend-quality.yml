name: Backend Quality

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'supabase/migrations/**'
      - '.github/scripts/supabase-migrate.sh'
      - '.github/workflows/backend-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Validate Supabase migration inventory
        run: bash ../.github/scripts/supabase-migrate.sh --check-only
      - run: bunx --no-install tsc --noEmit
      - run: bun test ./src
      - run: git diff --check
